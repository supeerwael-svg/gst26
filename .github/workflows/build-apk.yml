name: Build APK from Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Convert Web to Android Project (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "GST26" "com.gst26.app" --web-dir dist
          npx cap add android
          npx cap sync

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gst26-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

